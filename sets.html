<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set Catalog — Scryfall</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0f1012; --panel:#16171a; --panel2:#1c1e22; --border:#2a2c30;
    --text:#e7e5df; --dim:#8a8d93; --muted:#54575d;
    --ink:#6f9ec9; --stamp:#c9683f; --ok:#5fae7f;
  }
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;}
  .mono{font-family:"SF Mono",Consolas,Menlo,monospace;}

  header{position:sticky;top:0;z-index:10;background:rgba(15,16,18,0.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:1.1rem 1.4rem;}
  .title-row{display:flex;align-items:baseline;gap:0.6rem;margin-bottom:0.9rem;flex-wrap:wrap;}
  .title{font-size:1.15rem;font-weight:600;letter-spacing:-0.01em;}
  .title small{color:var(--dim);font-weight:400;font-size:0.85rem;}
  .count{margin-left:auto;color:var(--muted);font-size:0.8rem;}
  .count .mono{color:var(--dim);}

  .filter-row{display:flex;gap:0.6rem;max-width:900px;}
  .filter-row input{
    flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:0.6rem 0.8rem;color:var(--text);font-size:0.92rem;outline:none;transition:border-color .15s;
  }
  .filter-row input:focus{border-color:var(--ink);}
  .filter-row select{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--dim);
    font-size:0.82rem;padding:0.6rem 0.7rem;outline:none;cursor:pointer;
  }

  main{max-width:900px;margin:0 auto;padding:1.4rem;}

  .year-head{
    display:flex;align-items:center;gap:0.7rem;margin:1.6rem 0 0.5rem;color:var(--dim);
    font-size:0.78rem;letter-spacing:0.06em;
  }
  .year-head::after{content:'';flex:1;height:1px;background:var(--border);}

  .row{
    display:grid;grid-template-columns:22px 1fr auto auto auto;align-items:center;gap:0.8rem;
    padding:0.55rem 0.6rem;border-radius:6px;border:1px solid transparent;
    cursor:default;transition:background .12s,border-color .12s;
  }
  .row:hover{background:var(--panel);border-color:var(--border);}
  .row-icon{width:18px;height:18px;filter:invert(1) brightness(0.85);opacity:0.85;}
  .row-icon.blank{width:18px;height:18px;}
  .row-name{min-width:0;}
  .row-name .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-name .t{color:var(--muted);font-size:0.76rem;text-transform:capitalize;}
  .row-code{color:var(--dim);font-size:0.78rem;width:52px;text-align:right;}
  .row-count{color:var(--muted);font-size:0.78rem;width:64px;text-align:right;}
  .dl-btn{
    background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    color:var(--dim);font-size:0.74rem;padding:0.35rem 0.65rem;cursor:pointer;
    transition:all .12s;white-space:nowrap;
  }
  .dl-btn:hover{border-color:var(--stamp);color:var(--stamp);}
  .dl-btn:disabled{opacity:0.6;cursor:default;}
  .dl-btn.done{border-color:var(--ok);color:var(--ok);}

  .empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-style:italic;}

  .toast-wrap{position:fixed;bottom:1.2rem;right:1.2rem;display:flex;flex-direction:column;gap:0.5rem;z-index:900;}
  .toast{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.9rem;
    font-size:0.82rem;max-width:280px;animation:up .15s ease;}
  .toast.err{border-color:var(--stamp);}
  @keyframes up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
const root = document.getElementById('root');
let allSets = [];
let sortMode = 'released';

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function toast(msg, isErr){
  let wrap = document.querySelector('.toast-wrap');
  if(!wrap){ wrap = el('div','toast-wrap'); document.body.appendChild(wrap); }
  const t = el('div', 'toast'+(isErr?' err':''), msg);
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 4000);
}

async function loadSets(){
  const r = await fetch('https://api.scryfall.com/sets');
  const d = await r.json();
  allSets = d.data;
  render();
}

function sanitize(s){ return s.replace(/[\\/:*?"<>|]/g,'').trim(); }

async function downloadSetZip(set, btn){
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = 'Buscando…';
  try{
    let cards = [];
    let url = `https://api.scryfall.com/cards/search?q=e%3A${set.code}&unique=prints`;
    while(url){
      const r = await fetch(url);
      if(!r.ok) break;
      const d = await r.json();
      cards.push(...d.data);
      url = d.has_more ? d.next_page : null;
    }
    if(cards.length === 0){ toast(`Sin cartas descargables para ${set.code.toUpperCase()}`, true); btn.textContent = original; btn.disabled=false; return; }

    const zip = new JSZip();
    let done = 0;
    for(const c of cards){
      const img = c.image_uris?.normal || c.card_faces?.[0]?.image_uris?.normal;
      if(img){
        try{
          const resp = await fetch(img);
          const blob = await resp.blob();
          const name = sanitize(`${c.collector_number}_${c.name}`) + '.jpg';
          zip.file(name, blob);
        }catch(e){ /* skip failed image */ }
      }
      done++;
      btn.textContent = `${done}/${cards.length}`;
      await new Promise(res=>setTimeout(res, 60));
    }
    btn.textContent = 'Empaquetando…';
    const content = await zip.generateAsync({type:'blob'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = `${set.code}.zip`;
    a.click();
    btn.textContent = '✓ Listo';
    btn.classList.add('done');
    toast(`${set.name} — ${cards.length} cartas empaquetadas`);
  }catch(e){
    toast('Error al generar el ZIP', true);
    btn.textContent = original;
    btn.disabled = false;
  }
}

function groupByYear(sets){
  const map = new Map();
  for(const s of sets){
    const y = s.released_at ? s.released_at.slice(0,4) : 'Sin fecha';
    if(!map.has(y)) map.set(y, []);
    map.get(y).push(s);
  }
  return [...map.entries()];
}

function render(){
  const q = (document.querySelector('#filter')?.value || '').toLowerCase().trim();
  const filtered = allSets.filter(s =>
    s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)
  ).sort((a,b) => (b.released_at||'').localeCompare(a.released_at||''));

  root.innerHTML = '';

  const header = el('header');
  const titleRow = el('div','title-row');
  titleRow.appendChild(el('div','title','Set Catalog <small>Scryfall</small>'));
  titleRow.appendChild(el('div','count', `<span class="mono">${filtered.length}</span> / ${allSets.length} sets`));
  header.appendChild(titleRow);
  const filterRow = el('div','filter-row');
  const input = el('input');
  input.id = 'filter'; input.placeholder = 'Filtrar por nombre o código (ej. "murders" o mkm)…';
  input.value = q;
  input.addEventListener('input', render);
  filterRow.appendChild(input);
  header.appendChild(filterRow);
  root.appendChild(header);

  const main = el('main');
  if(allSets.length === 0){
    main.appendChild(el('div','empty','Cargando sets…'));
  } else if(filtered.length === 0){
    main.appendChild(el('div','empty','Ningún set coincide con ese filtro.'));
  } else {
    for(const [year, sets] of groupByYear(filtered)){
      main.appendChild(el('div','year-head', year));
      for(const s of sets){
        const row = el('div','row');
        const icon = s.icon_svg_uri ? el('img','row-icon') : el('div','row-icon blank');
        if(s.icon_svg_uri) icon.src = s.icon_svg_uri;
        row.appendChild(icon);

        const name = el('div','row-name');
        name.appendChild(el('div','n', s.name));
        name.appendChild(el('div','t', s.set_type.replace(/_/g,' ')));
        row.appendChild(name);

        row.appendChild(el('div','row-code mono', s.code.toUpperCase()));
        row.appendChild(el('div','row-count mono', `${s.card_count} cartas`));

        const btn = el('button','dl-btn', '↓ ZIP');
        btn.addEventListener('click', () => downloadSetZip(s, btn));
        row.appendChild(btn);

        main.appendChild(row);
      }
    }
  }
  root.appendChild(main);
}

loadSets();
</script>
</body>
</html>
